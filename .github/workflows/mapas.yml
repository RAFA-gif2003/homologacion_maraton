name: mapas-fondo-video
on:
  push:
    branches: [mapas-tmp]
permissions:
  contents: write
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Ortofoto PNOA (IGN, WMS) teselas restantes
        run: |
          mkdir -p mapas
          for t in 696000,4241192 696000,4245288 696000,4249384 700096,4245288 700096,4249384 704192,4245288 704192,4249384 708288,4233000 708288,4245288 708288,4249384 712384,4233000 712384,4249384 716480,4233000 720576,4233000 720576,4237096; do
            x0=${t%,*}; y0=${t#*,}; x1=$((x0+4096)); y1=$((y0+4096))
            for i in 1 2 3; do
              curl -sf --max-time 120 -o "mapas/pnoa_${x0}_${y0}.jpg" "https://www.ign.es/wms-inspire/pnoa-ma?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=OI.OrthoimageCoverage&STYLES=&CRS=EPSG:25830&BBOX=${x0},${y0},${x1},${y1}&WIDTH=2048&HEIGHT=2048&FORMAT=image/jpeg" && file "mapas/pnoa_${x0}_${y0}.jpg" | grep -q JPEG && break
              rm -f "mapas/pnoa_${x0}_${y0}.jpg"; sleep 5
            done
          done
          ls -la mapas
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add mapas && git commit -m "Ortofoto PNOA restante (© IGN)" && git push
