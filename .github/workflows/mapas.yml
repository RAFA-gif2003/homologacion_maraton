name: mapas-fondo-video
on:
  push:
    branches: [mapas-tmp]
permissions:
  contents: write
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Ortofoto PNOA de detalle (0,2 m/px) en cada contenedor
        run: |
          mkdir -p mapas
          for w in 1,715059,4241862,715759,4242312 2,716682,4242686,717382,4243136 3,717190,4244575,717890,4245025 4,717711,4245546,718411,4245996 5,718742,4246051,719442,4246501 6,719278,4246064,719978,4246514; do
            IFS=, read n x0 y0 x1 y1 <<< "$w"
            for i in 1 2 3; do
              curl -sf --max-time 180 -o "mapas/det_${n}_${x0}_${y0}_${x1}_${y1}.jpg" "https://www.ign.es/wms-inspire/pnoa-ma?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=OI.OrthoimageCoverage&STYLES=&CRS=EPSG:25830&BBOX=${x0},${y0},${x1},${y1}&WIDTH=3500&HEIGHT=2250&FORMAT=image/jpeg" && file mapas/det_${n}_*.jpg | grep -q JPEG && break
              rm -f mapas/det_${n}_*.jpg; sleep 5
            done
          done
          ls -la mapas
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add mapas && git commit -m "Ortofoto PNOA de detalle (© IGN)" && git push
      - name: Límite del término municipal de Alicante (OSM)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool > /dev/null
          curl -sfL --max-time 600 -o v.osm.pbf https://download.geofabrik.de/europe/spain/valencia-latest.osm.pbf
          osmium extract -b -0.80,38.20,-0.30,38.50 v.osm.pbf -o z.osm.pbf --overwrite
          osmium tags-filter z.osm.pbf r/boundary=administrative -o b.osm.pbf --overwrite
          osmium export b.osm.pbf -f geojsonseq -o b.geojsonseq --overwrite --geometry-types=polygon
          grep '"admin_level":"8"' b.geojsonseq | grep -E '"name":"(Alacant|Alicante|Elx|Elche)' > mapas/limites_tm.geojsonseq || true
          ls -la mapas
          git pull --rebase -q || true
          git add mapas && git commit -m "Límites municipales (© OpenStreetMap contributors)" && git push
