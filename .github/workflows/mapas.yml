name: mapas-fondo-video
on:
  push:
    branches: [mapas-tmp]
permissions:
  contents: write
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Fotos (Wikipedia/Commons) y coordenadas de los puntos turísticos
        run: |
          python3 poi/fotos_wiki.py || true
          ls -la mapas/poi
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add mapas && git commit -m "Fotos de Wikimedia Commons para los puntos turísticos" && git push
