name: mapas-fondo-video
on:
  push:
    branches: [mapas-tmp]
permissions:
  contents: write
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Límites municipales (OSM)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool > /dev/null
          curl -sfL --max-time 600 -o v.osm.pbf https://download.geofabrik.de/europe/spain/valencia-latest.osm.pbf
          osmium extract -b -0.80,38.20,-0.30,38.50 v.osm.pbf -o z.osm.pbf --overwrite
          osmium tags-filter z.osm.pbf r/boundary=administrative -o b.osm.pbf --overwrite
          osmium export b.osm.pbf -f geojsonseq -o b.geojsonseq --overwrite --geometry-types=polygon,multipolygon
          mkdir -p mapas
          python3 - <<'PY'
          import json
          out = open('mapas/limites_tm.geojsonseq', 'w'); n = 0
          for ln in open('b.geojsonseq'):
              f = json.loads(ln.strip().lstrip('\x1e')); p = f.get('properties') or {}
              if str(p.get('admin_level')) == '8':
                  out.write(json.dumps(f) + '\n'); n += 1; print(p.get('name'))
          print('municipios', n)
          PY
          ls -la mapas
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add mapas && git commit -m "Límites municipales (© OpenStreetMap contributors)" && git push
