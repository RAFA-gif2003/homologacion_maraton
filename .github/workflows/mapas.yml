name: mapas-fondo-video
on:
  push:
    branches: [mapas-tmp]
permissions:
  contents: write
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Callejero OpenStreetMap (Overpass)
        run: |
          mkdir -p mapas
          Q='[out:json][timeout:300];(way["highway"](38.225,-0.75,38.375,-0.44);way["railway"~"rail|light_rail|tram"](38.225,-0.75,38.375,-0.44);way["natural"~"coastline|water|beach"](38.20,-0.78,38.40,-0.40);way["waterway"~"river|canal|stream"](38.225,-0.75,38.375,-0.44);way["leisure"~"park|garden"](38.225,-0.75,38.375,-0.44);way["landuse"~"grass|forest|orchard|farmland|industrial"](38.225,-0.75,38.375,-0.44););out geom qt;'
          ok=0
          for u in https://overpass-api.de/api/interpreter https://overpass.kumi.systems/api/interpreter https://overpass.private.coffee/api/interpreter; do
            for i in 1 2; do
              if curl -sf --max-time 600 -o mapas/osm.json --data-urlencode "data=$Q" "$u" && [ $(stat -c%s mapas/osm.json) -gt 100000 ]; then ok=1; break 2; fi
              sleep 20
            done
          done
          [ $ok = 1 ] || { echo "Overpass falló"; exit 1; }
          gzip -9 mapas/osm.json; ls -la mapas
      - name: Ortofoto PNOA (IGN, WMS) 2 m/px
        run: |
          for t in 696000,4233000 696000,4237096 700096,4233000 700096,4237096 700096,4241192 704192,4233000 704192,4237096 704192,4241192 708288,4237096 708288,4241192 712384,4237096 712384,4241192 712384,4245288 716480,4237096 716480,4241192 716480,4245288 716480,4249384 720576,4241192 720576,4245288 720576,4249384; do
            x0=${t%,*}; y0=${t#*,}; x1=$((x0+4096)); y1=$((y0+4096))
            for i in 1 2 3; do
              curl -sf --max-time 180 -o "mapas/pnoa_${x0}_${y0}.jpg" "https://www.ign.es/wms-inspire/pnoa-ma?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=OI.OrthoimageCoverage&STYLES=&CRS=EPSG:25830&BBOX=${x0},${y0},${x1},${y1}&WIDTH=2048&HEIGHT=2048&FORMAT=image/jpeg" && file "mapas/pnoa_${x0}_${y0}.jpg" | grep -q JPEG && break
              sleep 10
            done
          done
          ls -la mapas
      - name: Guardar en la rama
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add mapas && git commit -m "Datos de fondo: OSM (© OpenStreetMap contributors) y PNOA (© IGN)" && git push
