name: mapas-fondo-video
on:
  push:
    branches: [mapas-tmp]
permissions:
  contents: write
concurrency:
  group: mapas
  cancel-in-progress: true
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Ortofoto PNOA (IGN, WMS) 2 m/px
        run: |
          mkdir -p mapas
          for t in 696000,4233000 696000,4237096 700096,4233000 700096,4237096 700096,4241192 704192,4233000 704192,4237096 704192,4241192 708288,4237096 708288,4241192 712384,4237096 712384,4241192 712384,4245288 716480,4237096 716480,4241192 716480,4245288 716480,4249384 720576,4241192 720576,4245288 720576,4249384; do
            x0=${t%,*}; y0=${t#*,}; x1=$((x0+4096)); y1=$((y0+4096))
            for i in 1 2 3; do
              curl -sf --max-time 120 -o "mapas/pnoa_${x0}_${y0}.jpg" "https://www.ign.es/wms-inspire/pnoa-ma?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=OI.OrthoimageCoverage&STYLES=&CRS=EPSG:25830&BBOX=${x0},${y0},${x1},${y1}&WIDTH=2048&HEIGHT=2048&FORMAT=image/jpeg" && file "mapas/pnoa_${x0}_${y0}.jpg" | grep -q JPEG && break
              rm -f "mapas/pnoa_${x0}_${y0}.jpg"; sleep 5
            done
          done
          ls -la mapas
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add mapas && git commit -m "Ortofoto PNOA (© IGN)" && git push
      - name: Callejero OSM (Geofabrik + osmium)
        run: |
          sudo apt-get -qq update && sudo apt-get -qq install -y osmium-tool > /dev/null
          curl -sfL --max-time 600 -o valencia.osm.pbf https://download.geofabrik.de/europe/spain/valencia-latest.osm.pbf
          ls -la valencia.osm.pbf
          osmium extract -b -0.78,38.20,-0.40,38.40 valencia.osm.pbf -o zona.osm.pbf --overwrite
          osmium tags-filter zona.osm.pbf w/highway w/railway w/natural=coastline,water,beach w/waterway w/leisure=park,garden w/landuse=grass,forest,orchard,farmland,industrial -o filtro.osm.pbf --overwrite
          osmium export filtro.osm.pbf -f geojsonseq -o mapas/osm.geojsonseq --overwrite --geometry-types=linestring,polygon
          gzip -9 mapas/osm.geojsonseq; ls -la mapas
          git pull --rebase -q || true
          git add mapas && git commit -m "Callejero OSM (© OpenStreetMap contributors)" && git push
