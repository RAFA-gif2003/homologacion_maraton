name: mapas-fondo-video
on:
  push:
    branches: [mapas-tmp]
permissions:
  contents: write
jobs:
  descarga:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Ortofoto PNOA de la zona de aparcamiento
        run: |
          mkdir -p mapas
          for w in det,720235,4247059,720655,4247339,3500,2333 sit,719645,4246699,721245,4247699,3200,2000; do
            IFS=, read n x0 y0 x1 y1 W H <<< "$w"
            for i in 1 2 3; do
              curl -sf --max-time 180 -o "mapas/${n}_${x0}_${y0}_${x1}_${y1}.jpg" "https://www.ign.es/wms-inspire/pnoa-ma?SERVICE=WMS&REQUEST=GetMap&VERSION=1.3.0&LAYERS=OI.OrthoimageCoverage&STYLES=&CRS=EPSG:25830&BBOX=${x0},${y0},${x1},${y1}&WIDTH=${W}&HEIGHT=${H}&FORMAT=image/jpeg" && file mapas/${n}_*.jpg | grep -q JPEG && break
              rm -f mapas/${n}_*.jpg; sleep 5
            done
          done
          ls -la mapas
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add mapas && git commit -m "Ortofoto PNOA (© IGN)" && git push
